  <link

    crossorigin=""

  <style>
    :root {
      --surface: #ffffff;
      --surface-soft: #f5f7f8;
      --line: #cfd7dd;
      --text: #172026;
      --muted: #5f6f7a;
      --active: #165a72;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--surface-soft);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      z-index: 1000;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .status {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .control-strip {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-grid;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: var(--surface);
    }

    .route-toggle { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
    .date-toggle { grid-template-columns: repeat(6, minmax(125px, 1fr)); }

    .segmented button {
      padding: 8px 10px;
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .segmented button:last-child { border-right: 0; }
    .segmented button:hover { background: #eef3f5; }
    .segmented button.active {
      color: #ffffff;
      background: var(--active);
    }

    #map {
      flex: 1 1 auto;
      width: 100%;
      height: calc(100vh - 59px);
      min-height: 360px;
    }

    .legend-box {
      padding: 10px 12px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 18px rgba(23, 32, 38, 0.14);
      font-size: 12px;
      line-height: 1.4;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }

    .swatch-line {
      width: 34px;
      border-top: 5px solid #000000;
    }

    @media (max-width: 1050px) {
      .toolbar { align-items: stretch; flex-direction: column; gap: 9px; }
      .control-strip { justify-content: stretch; }
      .segmented { width: 100%; }
      .route-toggle { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .date-toggle { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #map { height: calc(100vh - 145px); }
    }
  </style>

73730919855], [-90.34167796713224, 38.74240565546827], [-90.34725854333031, 38.74703733557797], [-90.35300617133261, 38.74716771853452], [-90.35875383649973, 38.747297819251436], [-90.36450153875144, 38.7474276377232], [-90.37024927800739, 38.74755717394432]]}}]};
    const routeStyles = {"MidAmerica to Downtown St. Louis": {"short_label": "MidAmerica to Downtown", "color": "#dc2626"}, "MidAmerica to St. Louis Lambert": {"short_label": "MidAmerica to Lambert", "color": "#2563eb"}, "St. Louis Downtown Airport to St. Louis Lambert": {"short_label": "Downtown Airport to Lambert", "color": "#16a34a"}};
    const routeOrder = ["MidAmerica to Downtown St. Louis", "MidAmerica to St. Louis Lambert", "St. Louis Downtown Airport to St. Louis Lambert"];
    const datasetOrder = [{"date": "2026-03-07", "label": "March 7th - Saturday"}, {"date": "2026-03-09", "label": "March 9th - Monday"}, {"date": "2026-01-10", "label": "January 10th - Saturday"}, {"date": "2026-01-12", "label": "January 12th - Monday"}, {"date": "2025-07-12", "label": "July 12th - Saturday"}, {"date": "2025-07-14", "label": "July 14th - Monday"}];
    const endpointData = {"MidAmerica to Downtown St. Louis": {"start_label": "MidAmerica St. Louis Airport", "start": [38.5451731, -89.8351856], "destination_label": "Downtown St. Louis", "destination": [38.627003, -90.199402]}, "MidAmerica to St. Louis Lambert": {"start_label": "MidAmerica St. Louis Airport", "start": [38.5451731, -89.8351856], "destination_label": "St. Louis Lambert International Airport", "destination": [38.7486982, -90.3700257]}, "St. Louis Downtown Airport to St. Louis Lambert": {"start_label": "St. Louis Downtown Airport", "start": [38.5703611, -90.1550833], "destination_label": "St. Louis Lambert International Airport", "destination": [38.7486982, -90.3700257]}};

    const map = L.map("map", {
      center: [38.719886, -90.259049],
      zoom: 10,
      preferCanvas: true
    });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }).addTo(map);

    const routeToggle = document.getElementById("routeToggle");
    const dateToggle = document.getElementById("dateToggle");
    const statusEl = document.getElementById("status");
    const routeLayers = {};
    const endpointLayer = L.layerGroup().addTo(map);
    let activeDate = datasetOrder[0].date;
    let activeRoutes = new Set(routeOrder);

    routeOrder.forEach((routeName) => {
      routeLayers[routeName] = L.geoJSON(null, {
        style: {
          color: routeStyles[routeName].color,
          weight: 6,
          opacity: 0.92
        },
        onEachFeature: (feature, layer) => {
          const properties = feature.properties || {};
          layer.bindPopup(
            `<b>${properties.route}</b><br>` +
            `<b>Traffic:</b> ${properties.dataset}<br>` +
            `<b>Origin:</b> ${properties.origin}<br>` +
            `<b>Destination:</b> ${properties.destination}<br>` +
            `<b>Path nodes:</b> ${properties.path_nodes}`
          );
        }
      });
    });

    function updateEndpoints() {
      endpointLayer.clearLayers();
      const endpointKeys = new Set();

      routeOrder.forEach((routeName) => {
        if (!activeRoutes.has(routeName)) return;
        const endpoints = endpointData[routeName];

        [
          { type: "Origin", data: endpoints.start },
          { type: "Destination", data: endpoints.destination }
        ].forEach((endpoint) => {
          const key = `${endpoint.data[0]},${endpoint.data[1]}`;
          if (endpointKeys.has(key)) return;
          endpointKeys.add(key);

          L.circleMarker(endpoint.data, {
            radius: 7,
            color: "#172026",
            weight: 2,
            fillColor: endpoint.type === "Origin" ? "#ffffff" : "#facc15",
            fillOpacity: 1
          }).bindPopup(
            `<b>${endpoint.type}</b><br>${endpoints[endpoint.type === "Origin" ? "start_label" : "destination_label"]}`
          ).addTo(endpointLayer);
        });
      });
    }

    function drawSelection() {
      Object.values(routeLayers).forEach((layer) => {
        layer.clearLayers();
        map.removeLayer(layer);
      });

      routeData.features.forEach((feature) => {
        const properties = feature.properties || {};
        if (
          properties.date === activeDate &&
          activeRoutes.has(properties.route)
        ) {
          routeLayers[properties.route].addData(feature);
        }
      });

      routeOrder.forEach((routeName) => {
        const layer = routeLayers[routeName];
        if (activeRoutes.has(routeName) && layer.getLayers().length > 0) {
          layer.addTo(map);
        }
      });

      updateEndpoints();
      updateButtons();

      const selectedDataset = datasetOrder.find(
        (dataset) => dataset.date === activeDate
      );
      statusEl.textContent =
        `${activeRoutes.size} route(s), ${selectedDataset.label} traffic`;
    }

    function updateButtons() {
      Array.from(routeToggle.querySelectorAll("button")).forEach((button) => {
        const isActive = activeRoutes.has(button.dataset.route);
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });

      Array.from(dateToggle.querySelectorAll("button")).forEach((button) => {
        const isActive = button.dataset.date === activeDate;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    routeOrder.forEach((routeName) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.route = routeName;
      button.textContent = routeStyles[routeName].short_label;
      button.addEventListener("click", () => {
        if (activeRoutes.has(routeName)) {
          if (activeRoutes.size === 1) return;
          activeRoutes.delete(routeName);
        } else {
          activeRoutes.add(routeName);
        }
        drawSelection();
      });
      routeToggle.appendChild(button);
    });

    datasetOrder.forEach((dataset) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.date = dataset.date;
      button.textContent = dataset.label;
      button.addEventListener("click", () => {
        activeDate = dataset.date;
        drawSelection();
      });
      dateToggle.appendChild(button);
    });

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function() {
      const div = L.DomUtil.create("div", "legend-box");
      const rows = routeOrder.map((routeName) => `
        <div class="legend-row">
          <span class="swatch-line" style="border-top-color:${routeStyles[routeName].color}"></span>
          <span>${routeStyles[routeName].short_label}</span>
        </div>
      `).join("");
      div.innerHTML = `<b>Routes</b>${rows}`;
      return div;
    };
    legend.addTo(map);

    drawSelection();
  </script>
