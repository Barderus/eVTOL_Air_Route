      top: 16px;

      line-height: 1.35;

      display: none;
    }
    #clusterIndex strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .cluster-row {

      background: transparent;

      gap: 7px;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid rgba(209, 213, 219, 0.55);
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .cluster-row:hover {
      background: rgba(229, 231, 235, 0.55);
    }
    .cluster-row.is-hidden {
      opacity: 0.42;
    }
    .cluster-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.25);
    }
