<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>St. Louis Route Weight Barycentric Tetrahedron</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }
    #plot {
      width: 100%;
      height: 100vh;
      min-height: 720px;
    }
    #selection {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      min-width: 250px;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
      color: #111827;
      font-size: 14px;
      line-height: 1.45;
    }
    #selection strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }
    #selection .weights {
      margin-top: 6px;
      font-family: Consolas, Monaco, monospace;
    }
    #clusterIndex {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 10;
      width: 248px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 12px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
      color: #111827;
      font-size: 13px;
      line-height: 1.35;
    }
    #clusterIndex:empty {
      display: none;
    }
    #clusterIndex strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .cluster-row {
      appearance: none;
      width: 100%;
      border: 0;
      background: transparent;
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 7px;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid rgba(209, 213, 219, 0.55);
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .cluster-row:hover {
      background: rgba(229, 231, 235, 0.55);
    }
    .cluster-row.is-hidden {
      opacity: 0.42;
    }
    .cluster-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.25);
    }
  </style>
</head>

      clusterIndex.querySelectorAll(".cluster-row").forEach((row) => {
        row.addEventListener("click", () => {
          const traceIndex = Number(row.dataset.traceIndex);
          const isHidden = row.classList.toggle("is-hidden");
          Plotly.restyle(
            plot,
            { visible: isHidden ? "legendonly" : true },
            [traceIndex]
          );
        });
      });
    });
  </script>
</body>
</html>
