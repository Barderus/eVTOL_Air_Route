      cursor: pointer;
      font: inherit;
      text-align: left;

    .cluster-row:hover {
      background: rgba(229, 231, 235, 0.55);
    }
    .cluster-row.is-hidden {
      opacity: 0.42;
    }
    .cluster-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.25);
