89.83272609742262], [38.54518713674757, -89.83845499191484], [38.54534185422887, -89.84418393041321], [38.54549629189633, -89.8499129128385], [38.545650449743434, -89.85564193911159], [38.54580432776372, -89.86137100915332], [38.545957925950695, -89.86710012288452], [38.546111244297876, -89.87282928022606], [38.54626428279884, -89.8785584810987], [38.54641704144712, -89.88428772542336], [38.5465695202363, -89.8900170131208], [38.54672171915994, -89.89574634411186], [38.546873638211636, -89.90147571831739], [38.54702527738502, -89.90720513565815], [38.54717663667367, -89.91293459605497], [38.54732771607122, -89.91866409942871], [38.54747851557132, -89.92439364570006], [38.54762903516762, -89.9301232347899], [38.55227884253414, -89.93566171159593], [38.55692841373979, -89.94120090063481], [38.557078141522354, -89.94693132996858], [38.55722758928637, -89.9526618018245], [38.55737675702556, -89.95839231612332], [38.55752564473363, -89.9641228727858], [38.5576742524043, -89.96985347173262], [38.56232230635172, -89.97539536640897], [38.566970123410094, -89.98093797377864], [38.57161770344731, -89.98648129402048], [38.571765261757655, -89.99221313054706], [38.571912539865146, -89.99794500899198], [38.5720595377636, -90.00367692927587], [38.572206255446844, -90.00940889131944], [38.57235269290866, -90.01514089504332], [38.5724988501429, -90.02087294036811], [38.572644727143405, -90.02660502721452], [38.57279032390402, -90.03233715550313], [38.572935640418635, -90.0380693251546], [38.57308067668109, -90.04380153608955], [38.57322543268529, -90.04953378822863], [38.57786994989744, -90.05508220119658], [38.57801416845261, -90.06081489219632], [38.57815810668649, -90.06654762417196], [38.57830176459299, -90.072280397044], [38.57844514216606, -90.07801321073313], [38.578588239399664, -90.0837460651599], [38.57873105628777, -90.08947896024489], [38.57887359282438, -90.09521189590866], [38.57901584900345, -90.10094487207182], [38.579157824818985, -90.10667788865496], [38.579299520265025, -90.11241094557855], [38.57944093533558, -90.11814404276322], [38.579582070024706, -90.12387718012955], [38.57972292432643, -90.1296103575981], [38.579863498234836, -90.13534357508938], [38.580003791744, -90.14107683252396], [38.58464420615243, -90.14663191796852], [38.589284380730234, -90.15218771733517], [38.593924315345014, -90.15774423080212], [38.59856400986431, -90.16330145854758], [38.60320346415569, -90.16885940074975], [38.60784267808668, -90.17441805758689], [38.6079811415637, -90.18015373543601], [38.61261985640587, -90.18571350391167], [38.61725833052981, -90.19127398739786], [38.62189656380297, -90.19683518607279], [38.62653455609276, -90.20239710011477], [38.63117230726659, -90.20795972970198]]}}};
    const methodOrder = [{"key": "hierarchical_jaccard", "label": "Hierarchical + Jaccard"}];
    const map = L.map("map", {
      center: routePayload.origin,
      zoom: 10,
      preferCanvas: true
    });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }).addTo(map);

    const methodToggle = document.getElementById("methodToggle");
    const statusEl = document.getElementById("status");
    const routeLayer = L.layerGroup().addTo(map);
    const endpointLayer = L.layerGroup().addTo(map);
    const clusterControl = L.control({ position: "topright" });
    let activeMethod = methodOrder[0].key;
    let hiddenClusters = new Set();
    let clusterLayers = new Map();
    let controlDiv = null;

    clusterControl.onAdd = function() {
      controlDiv = L.DomUtil.create("div", "cluster-panel");
      L.DomEvent.disableClickPropagation(controlDiv);
      L.DomEvent.disableScrollPropagation(controlDiv);
      return controlDiv;
    };
    clusterControl.addTo(map);

    function drawEndpoints() {
      endpointLayer.clearLayers();
      [
        { label: "Origin", name: routePayload.originLabel, point: routePayload.origin },
        { label: "Destination", name: routePayload.destinationLabel, point: routePayload.destination }
      ].forEach((endpoint) => {
        L.circleMarker(endpoint.point, {
          radius: 7,
          color: "#172026",
          weight: 2,
          fillColor: endpoint.label === "Origin" ? "#ffffff" : "#facc15",
          fillOpacity: 1
        }).bindPopup(`<b>${endpoint.label}</b><br>${endpoint.name}`).addTo(endpointLayer);
      });
    }

    function popupHtml(route) {
      const weights = route.weights;
      return `
        <b>${route.cluster}</b><br>
        <b>Weight:</b> ${route.weight_id}<br>
        <b>D/P/T/A:</b>
        ${weights.distance.toFixed(2)} /
        ${weights.population.toFixed(2)} /
        ${weights.traffic.toFixed(2)} /
        ${weights.airspace.toFixed(2)}<br>
        <b>Distance:</b> ${route.distance_km.toFixed(2)} km<br>
        <b>Score:</b> ${route.score.toFixed(3)}<br>
        <b>Nodes:</b> ${route.path_nodes}
      `;
    }

    function drawRoutes() {
      routeLayer.clearLayers();
      clusterLayers = new Map();
      const methodData = routePayload.methods[activeMethod];
      const largestCluster = Math.max(...methodData.clusters.map((cluster) => cluster.count), 1);
      const clusterSizes = new Map(
        methodData.clusters.map((cluster) => [cluster.cluster, cluster.count])
      );

      methodData.routes.forEach((route) => {
        const clusterSize = clusterSizes.get(route.cluster) || 1;
        const lineWeight = 2 + 5 * Math.sqrt(clusterSize / largestCluster);
        const line = L.polyline(route.points, {
          color: route.color,
          weight: lineWeight,
          opacity: hiddenClusters.has(route.cluster) ? 0 : 0.42,
          interactive: true
        }).bindPopup(popupHtml(route));

        if (!clusterLayers.has(route.cluster)) {
          clusterLayers.set(route.cluster, []);
        }
        clusterLayers.get(route.cluster).push(line);
        if (!hiddenClusters.has(route.cluster)) {
          line.addTo(routeLayer);
        }
      });

      renderClusterControl();
      statusEl.textContent =
        `${methodData.label}: ${methodData.clusters.length} clusters, ` +
        `${methodData.routes.length} route weights`;
    }

    function renderClusterControl() {
      const methodData = routePayload.methods[activeMethod];
      controlDiv.innerHTML = `
        <strong>${methodData.label} Clusters (${methodData.clusters.length})</strong>
        ${methodData.clusters.map((cluster) => `
          <button
            class="cluster-row ${hiddenClusters.has(cluster.cluster) ? "is-hidden" : ""}"
            type="button"
            data-cluster="${cluster.cluster}"
          >
            <span class="cluster-swatch" style="background:${cluster.color}"></span>
            <span>${cluster.cluster}</span>
            <span>${cluster.count}</span>
          </button>
        `).join("")}
      `;

      controlDiv.querySelectorAll(".cluster-row").forEach((row) => {
        row.addEventListener("click", () => {
          const cluster = row.dataset.cluster;
          if (hiddenClusters.has(cluster)) {
            hiddenClusters.delete(cluster);
          } else {
            hiddenClusters.add(cluster);
          }
          const isHidden = hiddenClusters.has(cluster);
          row.classList.toggle("is-hidden", isHidden);
          (clusterLayers.get(cluster) || []).forEach((layer) => {
            if (isHidden) {
              routeLayer.removeLayer(layer);
            } else {
              layer.addTo(routeLayer);
            }
          });
        });
      });
    }

    function setActiveMethod(methodKey) {
      activeMethod = methodKey;
      hiddenClusters = new Set();
      Array.from(methodToggle.querySelectorAll("button")).forEach((button) => {
        const isActive = button.dataset.method === activeMethod;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
      drawRoutes();
    }

    methodOrder.forEach((method) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.method = method.key;
      button.textContent = method.label;
      button.addEventListener("click", () => setActiveMethod(method.key));
      methodToggle.appendChild(button);
    });

    drawEndpoints();
    setActiveMethod(activeMethod);

    const firstBounds = routePayload.methods[activeMethod].bounds;
    if (firstBounds.length > 0) {
      map.fitBounds(firstBounds, { padding: [28, 28] });
    }
  </script>
